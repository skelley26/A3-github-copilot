<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Posts</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark sidebar-nav">
    <div class="container-fluid sidebar-inner">
      <a class="navbar-brand brand-mark" href="#">
        <span class="brand-dot"></span>
        Posts
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation"
        aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNavigation">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#posts">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="account.html">Account</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="following.html">Following</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="for-you.html">For you</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#logout">Log Out</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="page-content">
    <section id="posts" aria-labelledby="posts-heading">
      <p class="eyebrow mb-2">Your space to share</p>
      <h1 id="posts-heading" class="display-4 mb-3">Latest posts</h1>
      <p class="intro mb-5">A quiet place for ideas, updates, and everything worth keeping.</p>
      <div id="postList" class="post-list"></div>
      <div id="emptyState" class="posts-placeholder text-center">
        <button class="placeholder-icon" type="button" data-bs-toggle="modal" data-bs-target="#createPostModal"
          aria-label="Create a new post">+</button>
        <h2 class="h4">Your first post starts here</h2>
        <p class="mb-0">Future posts will appear in this space.</p>
      </div>
    </section>
  </main>

  <footer id="about" class="page-footer">
    <small>About this site</small>
  </footer>

  <div class="modal fade" id="createPostModal" tabindex="-1" aria-labelledby="createPostModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="createPostModalLabel">Create a post</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="postForm">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label" for="postTitle">Title</label>
              <input class="form-control" id="postTitle" name="title" type="text" maxlength="100" required>
            </div>
            <div>
              <label class="form-label" for="postBody">Post</label>
              <textarea class="form-control" id="postBody" name="body" rows="6" maxlength="2000" required></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-success">Publish post</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
